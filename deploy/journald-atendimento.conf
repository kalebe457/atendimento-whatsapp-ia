# Retenção dos logs do servidor (journald): 30 dias, no máximo 500 MB em disco.
# Os logs do backend já não têm dados pessoais (src/logSeguro.ts).
# A retenção do journald é do servidor inteiro (não por serviço).
# Instalar: sudo mkdir -p /etc/systemd/journald.conf.d
#           sudo cp deploy/journald-atendimento.conf /etc/systemd/journald.conf.d/atendimento.conf
#           sudo systemctl restart systemd-journald

[Journal]
Storage=persistent
MaxRetentionSec=30day
SystemMaxUse=500M
